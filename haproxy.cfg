global
    log stdout format raw local0
    maxconn 2000
    daemon

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

frontend http_front
    bind *:80
    default_backend http_back

backend http_back
    balance roundrobin
    server c1 your-container-ip:80 check        #(Container IP/ Container name)
    server c2 your-container-ip:80 check        #(Container IP/ Container name)
    server c3 your-container-ip:80 check        #(Container IP/ Container name)
    server c4 your-container-ip:80 check        #(Container IP/ Container name)
